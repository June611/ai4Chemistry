[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "molecular-gap-prediction"
version = "0.1.0"
description = "Reproducible Chemprop experiments for molecular HOMO-LUMO gap prediction"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "chemprop==2.3.1",
    "joblib>=1.3",
    "lightning>=2.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "rdkit>=2024.3",
    "scikit-learn==1.5.1",
    "smilespe==0.0.3",
    "tensorboard>=2.18",
    "torch==2.6.0",
    "tqdm>=4.66",
    "xgboost==2.0.3",
]

[project.scripts]
molgap-prepare = "molgap.data.preprocess:main"
molgap-train = "molgap.training.train:main"
molgap-predict = "molgap.training.predict:main"
molgap-evaluate = "molgap.training.evaluate:main"
molgap-audit-splits = "molgap.data.distribution:main"
molgap-train-transformer = "molgap.training.transformer:main"
molgap-train-spe-multitask = "molgap.training.spe_multitask:main"
molgap-train-ml = "molgap.training.ml:main"
molgap-run-multiseed = "molgap.experiments.multiseed:main"
molgap-summarize = "molgap.experiments.summary:main"
molgap-train-qm9 = "molgap.qm9_models.train:main"
molgap-bootstrap-qm9 = "molgap.qm9_models.bootstrap:main"
molgap-prepare-qm9-geometry = "molgap.qm9_models.prepare:main"
molgap-pretrain-3dinfomax = "molgap.qm9_models.pretrain_infomax:main"

[project.optional-dependencies]
qm9 = [
    "admin-torch>=0.1.0",
    "dgl==1.1.3",
    "einops>=0.8",
    "jarvis-tools>=2026.6.12",
    "ogb==1.3.6",
    "pydantic-settings>=2",
    "torch-geometric==2.6.1",
    "torchmd-net==3.0.3",
    "warp-lang==1.18.0",
]

[tool.uv]
default-groups = ["dev","analysis"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]
analysis = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/molgap"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
# Match the Linux/Python 3.11 CUDA environments used locally and on the server.
dgl = { url = "https://data.dgl.ai/wheels/cu121/dgl-1.1.3%2Bcu121-cp311-cp311-manylinux1_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'" }
warp-lang = { url = "https://github.com/NVIDIA/warp/releases/download/v1.18.0/warp_lang-1.18.0%2Bcu12-py3-none-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/molgap/_vendor"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
