# PaiNN Configuration for QM9 Gap Prediction
# Paper: Equivariant message passing for the prediction of tensorial properties and molecular spectra
# Repo: https://github.com/atomistic-machine-learning/schnetpack

experiment:
  name: painn_qm9
  model_type: painn

data:
  processed_dir: data/processed/qm9_full/random/seed3407
  geometry: data/geometry/qm9_full_seed3407.npz
  smiles_column: smiles
  id_column: sample_id
  target_column: delta_e
  targets: [delta_e]
  label_unit: hartree
  split:
    method: random
    sizes: [0.8, 0.1, 0.1]
    seed: 3407
    stratify:
      strategy: quantile
      column: delta_e
      bins: 200

model:
  name: painn
  params:
    n_atom_basis: 128
    n_interactions: 3
    n_rbf: 20
    cutoff: 5.0

training:
  seed: 3407
  epochs: 100
  batch_size: 256
  optimizer: adamw
  lr: 0.0005
  weight_decay: 0.00001
  gradient_clip_val: 1.0
  target_scaling: mad
  loss: mae
  accelerator: auto
  num_workers: 4
  early_stopping:
    monitor: val_mae
    patience: 20
    min_delta: 0.00001

evaluation:
  metrics: [mae, rmse, mape, r2]

output:
  root: outputs/paired_gap_mae_v2
  save_predictions: true
  save_model: true
