# Cormorant Configuration for QM9 Gap Prediction
# Paper: Cormorant: Covariant Molecular Neural Networks
# Repo: https://github.com/risilab/cormorant

experiment:
  name: cormorant_qm9
  model_type: cormorant

data:
  processed_dir: data/processed/qm9_full/random/seed3407
  geometry: data/geometry/qm9_full_seed3407.npz
  smiles_column: smiles
  id_column: sample_id
  target_column: delta_e
  targets: [delta_e]
  label_unit: hartree
  split:
    method: random
    sizes: [0.8, 0.1, 0.1]
    seed: 3407
    stratify:
      strategy: quantile
      column: delta_e
      bins: 200

model:
  name: cormorant
  params:
    maxl: 3
    max_sh: 2
    num_cg_levels: 3
    num_channels: 256

training:
  seed: 3407
  epochs: 100
  batch_size: 256
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0
  gradient_clip_val: 1.0
  target_scaling: mad
  loss: mae
  accelerator: auto
  num_workers: 4
  early_stopping:
    monitor: val_mae
    patience: 20
    min_delta: 0.00001

evaluation:
  metrics: [mae, rmse, mape, r2]

output:
  root: outputs/paired_gap_mae_v2
  save_predictions: true
  save_model: true
