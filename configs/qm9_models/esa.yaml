# ESA (Edge Set Attention) Configuration for QM9 Gap Prediction
# Paper: Attending to Graph Transformers
# Repo: https://github.com/davidbuterez/edge-set-attention

experiment:
  name: esa_qm9
  model_type: esa

data:
  processed_dir: data/processed/qm9_full/random/seed3407
  geometry: data/geometry/qm9_full_seed3407.npz  # ESA uses 2D graphs from SMILES
  smiles_column: smiles
  id_column: sample_id
  target_column: delta_e
  targets: [delta_e]
  label_unit: hartree
  split:
    method: random
    sizes: [0.8, 0.1, 0.1]
    seed: 3407
    stratify:
      strategy: quantile
      column: delta_e
      bins: 200

model:
  name: esa
  params:
    hidden_dim: 256
    num_heads: 16
    layer_types: ["M", "S", "M", "S", "M", "P"]
    num_outputs: 32
    norm_type: BN
    pre_or_post: post
    use_mlps: true
    mlp_hidden_size: 256
    num_mlp_layers: 3
    # Full QM9 maximum is 56 directed edges; pad to the next attention-friendly multiple of 8.
    max_edges: 64

training:
  seed: 3407
  epochs: 100
  batch_size: 256
  optimizer: adam
  lr: 0.0001
  weight_decay: 0.0
  gradient_clip_val: 1.0
  target_scaling: mad
  loss: mae
  accelerator: auto
  num_workers: 4
  early_stopping:
    monitor: val_mae
    patience: 20
    min_delta: 0.00001

evaluation:
  metrics: [mae, rmse, mape, r2]

output:
  root: outputs/paired_gap_mae_v2
  save_predictions: true
  save_model: true
