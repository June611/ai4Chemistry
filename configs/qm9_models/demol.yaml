experiment:
  name: demol_qm9_scratch
  model_type: demol
data:
  processed_dir: data/processed/qm9_full/random/seed3407
  geometry: data/geometry/qm9_full_seed3407.npz
  smiles_column: smiles
  id_column: sample_id
  target_column: delta_e
  targets:
  - delta_e
  label_unit: hartree
  split:
    method: random
    sizes:
    - 0.8
    - 0.1
    - 0.1
    seed: 3407
    stratify:
      strategy: quantile
      column: delta_e
      bins: 200
  topology: data/topology/qm9_full.npz
  remove_hydrogens: false
model:
  name: demol
  params:
    embed_dim: 768
    ffn_dim: 768
    num_layers: 12
    num_heads: 32
    num_kernel: 128
    attention_dropout: 0.1
    activation_checkpointing: true
    cutoff: 5.0
    covalent_radius_factor: 1.15
    distance_width: 8.0
    activation_dropout: 0.0
    bond_regularization: false
training:
  seed: 3407
  epochs: 100
  batch_size: 256
  optimizer: adamw
  lr: 7.0e-05
  weight_decay: 0.0
  gradient_clip_val: 5.0
  target_scaling: mad
  loss: mae
  accelerator: cuda
  num_workers: 4
  early_stopping:
    monitor: val_mae
    patience: 20
    min_delta: 1.0e-05
evaluation:
  metrics:
  - mae
  - rmse
  - mape
  - r2
output:
  root: outputs/qm9_demol_transformer_m_v1
  save_predictions: true
  save_model: true
provenance:
  sources_file: configs/qm9_models/demol_transformer_m.sources.json
  external_pretraining: false
  setting: QM9 scratch; fixed project protocol; not original paper data/step budget
smoke:
  batch_size: 256
  train_rows: 107038
  eval_rows: 13380
