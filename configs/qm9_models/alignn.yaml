# ALIGNN Configuration for QM9 Gap Prediction
# Paper: Atomistic Line Graph Neural Network for improved materials property predictions
# Repo: https://github.com/usnistgov/alignn

experiment:
  name: alignn_qm9
  model_type: alignn

data:
  processed_dir: data/processed/qm9_full/random/seed3407
  geometry: data/geometry/qm9_full_seed3407.npz
  smiles_column: smiles
  id_column: sample_id
  target_column: delta_e
  targets: [delta_e]
  label_unit: hartree
  split:
    method: random
    sizes: [0.8, 0.1, 0.1]
    seed: 3407
    stratify:
      strategy: quantile
      column: delta_e
      bins: 200

model:
  name: alignn
  params:
    cutoff: 8.0
    alignn_layers: 4
    gcn_layers: 4
    atom_input_features: 92
    edge_input_features: 80
    triplet_input_features: 40
    embedding_features: 64
    hidden_features: 128
    output_features: 1

training:
  seed: 3407
  epochs: 100
  batch_size: 256
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.00001
  gradient_clip_val: 1.0
  target_scaling: mad
  loss: mae
  accelerator: auto
  num_workers: 4
  early_stopping:
    monitor: val_mae
    patience: 20
    min_delta: 0.00001

evaluation:
  metrics: [mae, rmse, mape, r2]

output:
  root: outputs/paired_gap_mae_v2
  save_predictions: true
  save_model: true
