# EGNN Test Configuration (100 molecules for validation)

experiment:
  name: egnn_test_100
  model_type: egnn

data:
  processed_dir: data/processed/qm9_test_100/random/seed3407
  geometry: data/geometry/qm9_test_100_seed3407.npz
  smiles_column: smiles
  id_column: sample_id
  target_column: delta_e
  targets: [delta_e]
  label_unit: hartree
  split:
    method: random
    sizes: [0.8, 0.1, 0.1]
    seed: 3407
    stratify:
      strategy: quantile
      column: delta_e
      bins: 200

model:
  name: egnn
  params:
    hidden_nf: 32  # Smaller for testing
    n_layers: 3
    attention: true
    node_attr: 1

training:
  seed: 3407
  epochs: 10  # Just for validation
  batch_size: 16
  optimizer: adamw
  lr: 0.0005
  weight_decay: 0.000001
  gradient_clip_val: 1.0
  target_scaling: mad
  loss: mae
  accelerator: auto
  num_workers: 2

evaluation:
  metrics: [mae, rmse, mape, r2]

output:
  root: outputs
  save_predictions: true
  save_model: true
