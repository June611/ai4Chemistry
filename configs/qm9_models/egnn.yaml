# EGNN Model Configuration for QM9 Gap Prediction
# Based on: https://github.com/vgsatorras/egnn

experiment:
  name: egnn_qm9
  model_type: egnn

data:
  processed_dir: data/processed/qm9_full/random/seed3407
  geometry: data/geometry/qm9_full_seed3407.npz
  smiles_column: smiles
  id_column: sample_id
  target_column: delta_e
  targets: [delta_e]
  label_unit: hartree
  split:
    method: random
    sizes: [0.8, 0.1, 0.1]
    seed: 3407
    stratify:
      strategy: quantile
      column: delta_e
      bins: 200

model:
  name: egnn
  params:
    hidden_nf: 128
    n_layers: 7
    attention: true
    node_attr: 1

training:
  seed: 3407
  epochs: 100
  batch_size: 256
  optimizer: adamw
  lr: 0.0005
  weight_decay: 0.000001
  gradient_clip_val: 1.0
  target_scaling: mad
  loss: mae
  accelerator: auto
  num_workers: 4
  early_stopping:
    monitor: val_mae
    patience: 20
    min_delta: 0.00001

evaluation:
  metrics: [mae, rmse, mape, r2]

output:
  root: outputs/paired_gap_mae_v2
  save_predictions: true
  save_model: true
