# Work 2: λ=0 (pure 2D, should match Work 1 for verification)

model_type: work2
name: hybrid_3d_lambda0

# MPNN parameters
d_h: 300
mpnn_depth: 3

# Transformer parameters
d_model: 256
nhead: 8
num_layers: 4
dim_feedforward: 512
dropout: 0.1

# 3D geometry (λ=0 means no geometry injection)
pe_type: mlp
lambda_geometry: 0.0
learnable_lambda: false

# Multi-task
n_tasks: 7  # homo, lumo, gap, mu, alpha, R2, zpve
use_uncertainty_weighting: true

# Training
lr: 0.001
weight_decay: 0.0
warmup_epochs: 2
max_epochs: 100
batch_size: 32

# Seeds
seeds: [42, 3407, 12345]
