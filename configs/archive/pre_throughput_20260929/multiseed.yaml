name: qm9_five_seed

# Reuse this one immutable train/val/test split for every training run.
split_seed: 3407

# These seeds control model initialization, train-loader shuffling, dropout,
# workers, and other framework RNGs. They never change split membership.
training_seeds: [3407, 42, 2026, 7, 123]

# Maximum simultaneous training processes. All processes share the GPU below.
parallel_jobs: 2
gpu: "0"

data_config: configs/data/qm9_full.yaml

models:
  - name: chemprop_single_gap
    trainer: chemprop
    config: configs/baseline.yaml
  - name: chemprop_multitask
    trainer: chemprop
    config: configs/multitask.yaml
  - name: chemprop_consistency
    trainer: chemprop
    config: configs/consistency.yaml
  - name: smiles_transformer
    trainer: transformer
    config: configs/transformer.yaml

output:
  root: outputs/batches
