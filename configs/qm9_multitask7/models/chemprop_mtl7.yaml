experiment:
  name: chemprop_mtl7
  protocol_id: paired_split_qm9_neural_multitask7_v1
  model_id: chemprop_mtl7
  variant: B
data:
  processed_dir: data/processed/qm9_single_properties_v1/random/seed42
  property_data_root: data/processed/qm9_single_properties_v1
  smiles_column: smiles
  id_column: sample_id
  targets:
  - homo
  - lumo
  - delta_e
  - alpha
  - mu
  - r2
  - zpve
  units:
    homo: hartree
    lumo: hartree
    delta_e: hartree
    alpha: bohr^3
    mu: debye
    r2: bohr^2
    zpve: hartree
  split:
    method: random
    sizes:
    - 0.8
    - 0.1
    - 0.1
    seed: 42
    stratify:
      strategy: quantile
      column: delta_e
      bins: 200
model:
  backend: chemprop_python
  message_hidden_dim: 300
  depth: 3
  dropout: 0.1
  activation: relu
  aggregation: mean
  batch_norm: false
  ffn_hidden_dim: 300
  ffn_num_layers: 1
  use_affinity: false
  use_uncertainty: false
  affinity_temperature: 1.0
  affinity_identity_bias: 2.0
  head_layout: extra_projection
training:
  batch_size: 256
  epochs: 100
  patience: 20
  min_delta: 0.0
  warmup_epochs: 2
  init_lr: 0.0004
  max_lr: 0.004
  final_lr: 0.0004
  optimizer: adam
  weight_decay: 0.0
  grad_clip: null
  target_scaling: standard
  selection_metric: delta_e_mae
  seed: 42
  split_seed: 42
  accelerator: gpu
  devices: 1
  precision: 32-true
  num_workers: 4
  pin_memory: true
  deterministic: true
output:
  root: artifacts/qm9_multitask7/standalone
