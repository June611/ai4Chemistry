experiment:
  name: spe_multitask
  type: spe_multitask_transformer

data:
  processed_dir: data/processed/qm9_full/random/seed3407
  chemprop_reference_config: configs/consistency.yaml
  smiles_column: smiles
  id_column: sample_id
  target_column: delta_e
  target_columns: [homo, lumo, delta_e]
  targets: [homo, lumo, delta_e]
  label_unit: hartree
  split:
    method: random
    sizes: [0.8, 0.1, 0.1]
    seed: 3407
    stratify: {strategy: quantile, column: delta_e, bins: 200}

tokenizer:
  type: spe
  num_merges: 3000
  min_frequency: 100
  pattern: '(\[[^\]]+\]|Br?|Cl?|N|O|S|P|F|I|b|c|n|o|s|p|\(|\)|\.|=|#|-|\+|\\|\/|:|~|@|\?|>>?|\*|\$|\%[0-9]{2}|[0-9])'
  special_tokens: {pad: '[PAD]', unk: '[UNK]', cls: '[CLS]'}
  vocabulary_source: train
  max_length: 40
  overlength_policy: error

model:
  d_model: 256
  num_layers: 4
  num_heads: 8
  dim_feedforward: 512
  dropout: 0.1
  activation: gelu
  pooling: cls
  regression_hidden_dim: 128
  use_affinity: false
  affinity_temperature: 1.0
  affinity_identity_bias: 2.0
  min_parameters: 1000000
  max_parameters: 5000000

training:
  batch_size: 256
  epochs: 100
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.01
  warmup_ratio: 0.1
  min_lr_ratio: 0.1
  gradient_clip_val: 1.0
  target_scaling: standard
  early_stopping_patience: 20
  early_stopping_min_delta: 0.00001
  seed: 3407
  accelerator: auto
  devices: 1
  precision: 32-true
  num_workers: 8
  pin_memory: true
  log_every_n_steps: 50

loss:
  function: mse
  task_weights: {homo: 1.0, lumo: 1.0, delta_e: 1.0}
  consistency_weight: 0.0

evaluation:
  metrics: [mae, rmse, mape, r2]

output: {root: outputs}
