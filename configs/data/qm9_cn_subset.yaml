schema_version: 1

dataset:
  name: qm9_cn_subset
  artifact_version: "1.0.0"
  expected_rows: 14202
  source:
    path: data/raw/QM9_CN.csv
    encoding: gb18030
    id_column: 编号
    columns:
      smiles: SMILES
      homo: HomoEnergy
      lumo: LumoEnergy
      delta_e: EnergyGap

labels:
  unit: hartree
  consistency_tolerance: 1.0e-3
  derive_ev: false

processing:
  canonicalize_smiles: true
  preserve_stereo: true
  duplicate_tolerance: 1.1e-4
  duplicate_policy: mean_within_tolerance
  max_rejected_fraction: 0.05

split:
  method: random
  sizes: [0.8, 0.1, 0.1]
  seed: 3407

chemprop:
  target_columns: [delta_e]

output:
  root: data/processed

