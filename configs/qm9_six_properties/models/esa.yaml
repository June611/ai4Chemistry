experiment:
  name: homo
  model_type: esa
  model_id: esa
  protocol_id: paired_split_qm9_neural_single_property_v1
data:
  processed_dir: data/processed/qm9_single_properties_v1/random/seed3407
  geometry: data/geometry/qm9_full_seed3407.npz
  smiles_column: smiles
  id_column: sample_id
  target_column: homo
  targets:
  - homo
  label_unit: hartree
  split:
    method: random
    sizes:
    - 0.8
    - 0.1
    - 0.1
    seed: 3407
    stratify:
      strategy: quantile
      column: delta_e
      bins: 200
  chemprop_reference_config: GENERATED_BY_PREPARE
  property_data_root: data/processed/qm9_single_properties_v1
model:
  name: esa
  params:
    hidden_dim: 256
    num_heads: 16
    layer_types:
    - M
    - S
    - M
    - S
    - M
    - P
    num_outputs: 32
    norm_type: BN
    pre_or_post: post
    use_mlps: true
    mlp_hidden_size: 256
    num_mlp_layers: 3
    max_edges: 64
training:
  seed: 3407
  epochs: 100
  batch_size: 256
  optimizer: adam
  lr: 0.0001
  weight_decay: 0.0
  gradient_clip_val: 1.0
  target_scaling: standard
  loss: mse
  accelerator: auto
  num_workers: 4
  early_stopping:
    monitor: val_mae
    patience: 20
    min_delta: 0.0
  split_seed: 3407
  seed_pairing: matched
  run_mode: paired_split_seed
evaluation:
  metrics:
  - mae
  - rmse
  - mape
  - r2
output:
  root: artifacts/qm9_six_properties/GENERATED_BY_PREPARE/runs/esa
  save_predictions: true
  save_model: true
