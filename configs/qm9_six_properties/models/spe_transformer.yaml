experiment:
  name: homo
  type: smiles_transformer
  protocol_id: paired_split_qm9_neural_single_property_v1
  model_id: spe_transformer
data:
  processed_dir: data/processed/qm9_single_properties_v1/random/seed3407
  chemprop_reference_config: GENERATED_BY_PREPARE
  smiles_column: smiles
  id_column: sample_id
  target_column: homo
  targets:
  - homo
  label_unit: hartree
  split:
    method: random
    sizes:
    - 0.8
    - 0.1
    - 0.1
    seed: 3407
    stratify:
      strategy: quantile
      column: delta_e
      bins: 200
  property_data_root: data/processed/qm9_single_properties_v1
tokenizer:
  type: spe
  num_merges: 3000
  min_frequency: 100
  pattern: (\[[^\]]+\]|Br?|Cl?|N|O|S|P|F|I|b|c|n|o|s|p|\(|\)|\.|=|#|-|\+|\\|\/|:|~|@|\?|>>?|\*|\$|\%[0-9]{2}|[0-9])
  special_tokens:
    pad: '[PAD]'
    unk: '[UNK]'
    cls: '[CLS]'
  vocabulary_source: train
  max_length: 40
  overlength_policy: error
model:
  d_model: 256
  num_layers: 4
  num_heads: 8
  dim_feedforward: 512
  dropout: 0.1
  activation: gelu
  pooling: cls
  regression_hidden_dim: 128
  min_parameters: 1000000
  max_parameters: 5000000
training:
  batch_size: 256
  epochs: 100
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.01
  warmup_ratio: 0.1
  min_lr_ratio: 0.1
  gradient_clip_val: 1.0
  target_scaling: standard
  early_stopping_patience: 20
  early_stopping_min_delta: 0.0
  seed: 3407
  accelerator: auto
  devices: 1
  precision: 32-true
  num_workers: 4
  pin_memory: true
  log_every_n_steps: 50
  run_mode: paired_split_seed
  split_seed: 3407
  seed_pairing: matched
evaluation:
  metrics:
  - mae
  - rmse
  - mape
  - r2
output:
  root: artifacts/qm9_six_properties/GENERATED_BY_PREPARE/runs/spe_transformer
