experiment:
  name: homo
  model_type: torchmd_net
  model_id: torchmd_net
  protocol_id: paired_split_qm9_neural_single_property_v1
data:
  processed_dir: data/processed/qm9_single_properties_v1/random/seed3407
  geometry: data/geometry/qm9_full_seed3407.npz
  smiles_column: smiles
  id_column: sample_id
  target_column: homo
  targets:
  - homo
  label_unit: hartree
  split:
    method: random
    sizes:
    - 0.8
    - 0.1
    - 0.1
    seed: 3407
    stratify:
      strategy: quantile
      column: delta_e
      bins: 200
  chemprop_reference_config: GENERATED_BY_PREPARE
  property_data_root: data/processed/qm9_single_properties_v1
model:
  name: torchmd_net
  params:
    architecture: equivariant-transformer
    embedding_dimension: 128
    num_layers: 6
    num_rbf: 50
    rbf_type: expnorm
    trainable_rbf: false
    activation: silu
    cutoff: 5.0
    num_heads: 8
    distance_influence: both
training:
  seed: 3407
  epochs: 100
  batch_size: 256
  optimizer: adamw
  lr: 0.0001
  weight_decay: 1.0e-05
  gradient_clip_val: 1.0
  target_scaling: standard
  loss: mse
  accelerator: auto
  num_workers: 4
  early_stopping:
    monitor: val_mae
    patience: 20
    min_delta: 0.0
  split_seed: 3407
  seed_pairing: matched
  run_mode: paired_split_seed
evaluation:
  metrics:
  - mae
  - rmse
  - mape
  - r2
output:
  root: artifacts/qm9_six_properties/GENERATED_BY_PREPARE/runs/torchmd_net
  save_predictions: true
  save_model: true
