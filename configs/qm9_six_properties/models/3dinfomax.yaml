experiment:
  name: homo
  model_type: 3dinfomax
  model_id: 3dinfomax
  protocol_id: paired_split_qm9_neural_single_property_v1
data:
  processed_dir: data/processed/qm9_single_properties_v1/random/seed3407
  geometry: data/geometry/qm9_full_seed3407.npz
  smiles_column: smiles
  id_column: sample_id
  target_column: homo
  targets:
  - homo
  label_unit: hartree
  split:
    method: random
    sizes:
    - 0.8
    - 0.1
    - 0.1
    seed: 3407
    stratify:
      strategy: quantile
      column: delta_e
      bins: 200
  chemprop_reference_config: GENERATED_BY_PREPARE
  property_data_root: data/processed/qm9_single_properties_v1
model:
  name: 3dinfomax
  params:
    hidden_dim: 200
    propagation_depth: 7
    aggregators:
    - mean
    - max
    - min
    - std
    scalers:
    - identity
    - amplification
    - attenuation
    readout_aggregators:
    - min
    - max
    - mean
    - sum
    mid_batch_norm: true
    last_batch_norm: true
    readout_batchnorm: true
    batch_norm_momentum: 0.1
    readout_hidden_dim: 200
    readout_layers: 2
    dropout: 0.0
    pretrans_layers: 2
    posttrans_layers: 1
    residual: true
    require_pretrained: true
    pretrain_checkpoint: null
training:
  seed: 3407
  epochs: 100
  batch_size: 256
  optimizer: adam
  lr: 0.0001
  weight_decay: 0.0
  gradient_clip_val: 1.0
  target_scaling: standard
  loss: mse
  accelerator: auto
  num_workers: 4
  early_stopping:
    monitor: val_mae
    patience: 20
    min_delta: 0.0
  split_seed: 3407
  seed_pairing: matched
  run_mode: paired_split_seed
evaluation:
  metrics:
  - mae
  - rmse
  - mape
  - r2
output:
  root: artifacts/qm9_six_properties/GENERATED_BY_PREPARE/runs/3dinfomax
  save_predictions: true
  save_model: true
