  loss:
    function: mse
    weights:
      homo: 0.0
      lumo: 0.0
      gap: 1.0
      consistency: 0.0
  evaluation:
    metrics:
    - mae
    - rmse
    - r2
  output:
    root: outputs
data:
  smiles_column: smiles
  id_column: sample_id
  processed_dir: data/processed/qm9_single_properties_v1/random/seed3407
  split:
    method: random
    sizes:
    - 0.8
    - 0.1
    - 0.1
    seed: 3407
    stratify:
      strategy: quantile
      column: delta_e
      bins: 200
  targets:
  - zpve
  units:
    zpve: hartree
  selection_target: zpve
training:
  epochs: 200
  batch_size: 256
  patience: 20
  min_delta: 0.0
  checkpoint_every_n_epochs: 50
  seed: 3407
  split_seed: 3407
  run_mode: paired_split_seed
  seed_pairing: matched
  num_workers: 2
  pin_memory: true
  target_scaling: train_only_per_target_zscore
  supervised_loss: mse
  selection_metric: val_zpve_mae
