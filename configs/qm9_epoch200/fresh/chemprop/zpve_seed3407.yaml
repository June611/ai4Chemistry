status: implemented_pending_gpu_smoke
experiment:
  name: chemprop_single_task_zpve
  model_id: chemprop_single_task
  protocol_id: qm9_modular_fresh200_v1
backbone:
  model: chemprop
  family: graph
  input: 2D
source_config: configs/baseline.yaml
source:
  experiment:
    name: exp001_single_gap
    phase: 1
  data:
    processed_dir: data/processed/qm9_full/random/seed3407
