      pretrain_checkpoint: artifacts/qm9_epoch200/pretrained/3dinfomax_seed3407.pt
  training:
    seed: 3407
    epochs: 100
    batch_size: 256
    optimizer: adam
    lr: 0.0001
    weight_decay: 0.0
    gradient_clip_val: 1.0
    target_scaling: mad
    loss: mae
    accelerator: auto
    num_workers: 4
    early_stopping:
      monitor: val_mae
      patience: 20
      min_delta: 1.0e-05
  evaluation:
    metrics:
    - mae
    - rmse
    - mape
    - r2
  output:
    root: outputs/paired_gap_mae_v2
    save_predictions: true
    save_model: true
data:
  smiles_column: smiles
  id_column: sample_id
  processed_dir: data/processed/qm9_single_properties_v1/random/seed3407
  split:
    method: random
    sizes:
    - 0.8
    - 0.1
    - 0.1
    seed: 3407
    stratify:
      strategy: quantile
      column: delta_e
      bins: 200
  targets:
  - delta_e
  units:
    delta_e: hartree
  selection_target: delta_e
training:
  epochs: 200
  batch_size: 256
  patience: 20
  min_delta: 0.0
  checkpoint_every_n_epochs: 50
  seed: 3407
  split_seed: 3407
  run_mode: paired_split_seed
  seed_pairing: matched
  num_workers: 2
  pin_memory: true
  target_scaling: train_only_per_target_zscore
  supervised_loss: mse
  selection_metric: val_delta_e_mae
