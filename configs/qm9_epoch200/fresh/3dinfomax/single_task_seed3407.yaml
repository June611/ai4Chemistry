status: implemented_pending_gpu_smoke
experiment:
  name: 3dinfomax_single_task_delta_e
  model_id: 3dinfomax_single_task
  protocol_id: qm9_modular_fresh200_v1
backbone:
  model: 3dinfomax
  family: graph
  input: 3D pretrain / 2D inference
source_config: configs/qm9_models/3dinfomax.yaml
source:
  experiment:
    name: 3dinfomax_qm9
    model_type: 3dinfomax
  data:
    processed_dir: data/processed/qm9_full/random/seed3407
    geometry: data/geometry/qm9_full_seed3407.npz
    smiles_column: smiles
    id_column: sample_id
    target_column: delta_e
    targets:
    - delta_e
    label_unit: hartree
    split:
      method: random
      sizes:
      - 0.8
      - 0.1
      - 0.1
      seed: 3407
      stratify:
        strategy: quantile
        column: delta_e
        bins: 200
  model:
    name: 3dinfomax
    params:
      hidden_dim: 200
      propagation_depth: 7
      aggregators:
      - mean
      - max
      - min
      - std
