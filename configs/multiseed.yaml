# [HISTORICAL 100-epoch protocol — superseded by configs/qm9_epoch200/fresh (fresh-200).]
# Do NOT mix results from this matrix with the fresh-200 unified queue.
name: qm9_paired_seed3407
protocol_id: paired_split_gap_mae_v2
seed_pairing: matched

# This matrix owns the split/training seed 3407 pair.
split_seed: 3407

# The training seed must match the split seed under this protocol.
training_seeds: [3407]

# Maximum simultaneous training processes. All processes share the GPU below.
parallel_jobs: 1
gpu: "0"

data_config: configs/data/qm9_full.yaml

models:
  - name: chemprop_single_gap
    trainer: chemprop
    config: configs/baseline.yaml
  - name: chemprop_multitask
    trainer: chemprop
    config: configs/multitask.yaml
  - name: chemprop_consistency
    trainer: chemprop
    config: configs/consistency.yaml
  - name: smiles_transformer
    trainer: transformer
    config: configs/transformer.yaml

output:
  root: outputs/batches
